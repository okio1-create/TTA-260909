<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 관리</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --line: #e3e6ea; --text: #1e2329; --muted: #6b7380;
    --accent: #2f6fed; --accent-2: #e8effd; --danger: #d5433b; --ok: #1f9d55;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 18px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-2); color: var(--accent); }
  .badge.local { background: #fff4e0; color: #b26b00; }
  main { max-width: 980px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  #drop { border: 2px dashed #c9d2e0; border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
  #drop.over { border-color: var(--accent); background: var(--accent-2); color: var(--accent); }
  #drop input { display: none; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  .stats { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.name { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.num { text-align: right; color: var(--muted); white-space: nowrap; }
  td.actions { white-space: nowrap; text-align: right; }
  button, .btn { border: 1px solid var(--line); background: #fff; color: var(--text); padding: 6px 10px; border-radius: 7px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: #f1f3f6; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button.danger:hover { background: #fdecea; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--danger); }
  progress { width: 100%; height: 6px; margin-top: 10px; display: none; }
  @media (max-width: 640px) { .hide-sm { display: none; } td.name { max-width: 180px; } }
</style>
</head>
<body>
<header>
  <h1>📁 파일 관리</h1>
  <span class="badge {{ backend }}" title="저장소 백엔드">{{ '로컬 저장소' if backend == 'local' else 'Supabase 저장소' }}</span>
  <span class="stats" id="stats"></span>
</header>

<main>
  <section class="card">
    <label id="drop">
      <input type="file" id="fileInput" multiple>
      <div><strong>파일을 여기에 끌어다 놓거나 클릭해서 선택</strong></div>
      <div style="font-size:13px;margin-top:4px">여러 파일 동시 업로드 가능 · 파일당 최대 {{ max_upload_mb }} MB</div>
    </label>
    <progress id="prog" max="100" value="0"></progress>
  </section>

  <section class="card">
    <div class="toolbar">
      <input type="search" id="q" placeholder="파일명 검색…">
      <button id="refresh">새로고침</button>
    </div>
    <div style="overflow-x:auto;margin-top:12px">
      <table>
        <thead><tr><th>이름</th><th class="hide-sm">종류</th><th style="text-align:right">크기</th><th class="hide-sm">업로드</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>파일이 없습니다.</div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const rows = $('#rows'), q = $('#q'), drop = $('#drop'), input = $('#fileInput'), prog = $('#prog');
let toastTimer;

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2500);
}
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB','MB','GB']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
}
function fmtDate(s) { const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('ko-KR', {hour12:false}); }
function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function previewable(ct) { return /^(image\/|text\/|application\/pdf|video\/|audio\/)/.test(ct) && !/html|svg|xml|javascript/.test(ct); }

async function api(url, opts) {
  const r = await fetch(url, opts);
  let body = null; try { body = await r.json(); } catch {}
  if (!r.ok) throw new Error((body && body.error) || (r.status + ' ' + r.statusText));
  return body;
}

async function load() {
  const data = await api('/api/files?q=' + encodeURIComponent(q.value.trim()));
  rows.innerHTML = '';
  $('#empty').hidden = data.files.length > 0;
  for (const f of data.files) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="name" title="${esc(f.name)}">${esc(f.name)}</td>
      <td class="hide-sm" style="color:var(--muted)">${esc(f.content_type)}</td>
      <td class="num">${fmtSize(f.size)}</td>
      <td class="hide-sm" style="color:var(--muted)">${fmtDate(f.created_at)}</td>
      <td class="actions">
        ${previewable(f.content_type) ? `<a class="btn" target="_blank" href="/api/files/${f.id}/preview">보기</a>` : ''}
        <a class="btn" href="/api/files/${f.id}/download">다운로드</a>
        <button data-act="rename" data-id="${f.id}" data-name="${esc(f.name)}">이름변경</button>
        <button class="danger" data-act="delete" data-id="${f.id}" data-name="${esc(f.name)}">삭제</button>
      </td>`;
    rows.appendChild(tr);
  }
  const s = await api('/api/stats');
  $('#stats').textContent = `${s.count}개 파일 · ${fmtSize(s.total_size)}`;
}

rows.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.dataset.id, name = b.dataset.name;
  try {
    if (b.dataset.act === 'delete') {
      if (!confirm(`"${name}" 파일을 삭제할까요?`)) return;
      await api('/api/files/' + id, {method: 'DELETE'});
      toast('삭제했습니다');
    } else {
      const n = prompt('새 파일명', name); if (!n || n === name) return;
      await api('/api/files/' + id, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: n})});
      toast('이름을 변경했습니다');
    }
    load();
  } catch (err) { toast(err.message, true); }
});

function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('file', f);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/files');
  prog.style.display = 'block'; prog.value = 0;
  xhr.upload.onprogress = e => { if (e.lengthComputable) prog.value = e.loaded / e.total * 100; };
  xhr.onload = () => {
    prog.style.display = 'none';
    let body = {}; try { body = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status >= 200 && xhr.status < 300) { toast(`${body.count}개 파일 업로드 완료`); load(); }
    else toast(body.error || ('업로드 실패: ' + xhr.status), true);
  };
  xhr.onerror = () => { prog.style.display = 'none'; toast('네트워크 오류', true); };
  xhr.send(fd);
}

input.addEventListener('change', () => { upload(input.files); input.value = ''; });
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload(e.dataTransfer.files));
$('#refresh').addEventListener('click', load);
let qt; q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(load, 250); });

load().catch(err => toast(err.message, true));
</script>
</body>
</html>
